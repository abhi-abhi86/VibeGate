rules:
  # ---------------------------------------------------------------- SQL injection (Python)
  - id: python-sql-injection-fstring
    languages: [python]
    severity: ERROR
    message: >-
      A SQL query is built with an f-string and passed to execute(). If any interpolated value
      comes from a user, they can change the structure of the query (SQL injection).
    metadata:
      title: SQL query built with an f-string
      vibegate_category: injection
      vibegate_severity: high
      confidence: HIGH
      cwe: "CWE-89: SQL Injection"
      remediation: >-
        Use a parameterized query: keep the SQL text constant with placeholders (? for sqlite3,
        %s for psycopg/MySQL) and pass values as the second argument to execute().
    pattern-either:
      - pattern: $CUR.execute(f"...", ...)
      - pattern: $CUR.executemany(f"...", ...)
      - patterns:
          - pattern: |
              $Q = f"..."
              ...
              $CUR.execute($Q, ...)
          - focus-metavariable: $Q

  - id: python-sql-injection-string-build
    languages: [python]
    severity: ERROR
    message: >-
      A SQL query is built with string formatting or concatenation and passed to execute().
      User-controlled values can alter the query (SQL injection).
    metadata:
      title: SQL query built by string formatting
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-89: SQL Injection"
      remediation: Use a parameterized query and pass values separately to execute().
    pattern-either:
      - pattern: $CUR.execute("..." % $X, ...)
      - pattern: $CUR.execute("...".format(...), ...)
      - pattern: $CUR.execute("..." + $X, ...)
      - pattern: $CUR.execute($X + "...", ...)

  # ---------------------------------------------------------------- SQL injection (JS/TS)
  - id: js-sql-injection-template-literal
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A SQL query is built with a template literal containing interpolated values. User input can
      change the query structure (SQL injection).
    metadata:
      title: SQL query built with a template literal
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-89: SQL Injection"
      remediation: Use your driver's placeholders (e.g. db.query("... WHERE id = $1", [id])) instead of interpolation.
    patterns:
      - pattern: $DB.$METHOD(`...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|execute|raw|all|get|run|exec|prepare)$
      - metavariable-regex:
          metavariable: $DB
          regex: (?i).*(db|sql|conn|pool|client|knex|sequelize|prisma|database|pg|mysql).*

  # ---------------------------------------------------------------- Command injection
  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess is called with shell=True and a non-constant command. Shell metacharacters in user
      input can run arbitrary commands (command injection).
    metadata:
      title: Shell command built from dynamic input
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-78: OS Command Injection"
      remediation: Pass the command as a list of arguments with shell=False (the default) and validate inputs.
    patterns:
      - pattern-either:
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: python-os-system-dynamic
    languages: [python]
    severity: ERROR
    message: os.system() / os.popen() is called with a dynamically built string (command injection risk).
    metadata:
      title: os.system with dynamic input
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-78: OS Command Injection"
      remediation: Use subprocess.run([...]) with an argument list instead of a shell string.
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)

  - id: js-child-process-exec-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: child_process exec() is called with a dynamically built command string (command injection risk).
    metadata:
      title: exec() with dynamic command
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-78: OS Command Injection"
      remediation: Use execFile()/spawn() with an argument array and no shell.
    patterns:
      - pattern-either:
          - pattern: exec(`...${$X}...`, ...)
          - pattern: $CP.exec(`...${$X}...`, ...)
          - pattern: exec("..." + $X, ...)
          - pattern: $CP.exec("..." + $X, ...)

  # ---------------------------------------------------------------- Code execution / unsafe deserialization
  - id: python-eval-dynamic
    languages: [python]
    severity: ERROR
    message: eval()/exec() on a non-constant value can execute attacker-supplied code.
    metadata:
      title: eval/exec of dynamic input
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-95: Eval Injection"
      remediation: Avoid eval/exec; use ast.literal_eval for literals or an explicit parser.
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: python-yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: yaml.load() without SafeLoader can construct arbitrary Python objects from untrusted input.
    metadata:
      title: Unsafe YAML load
      vibegate_category: injection
      vibegate_severity: medium
      confidence: HIGH
      cwe: "CWE-502: Deserialization of Untrusted Data"
      remediation: Use yaml.safe_load() or pass Loader=yaml.SafeLoader.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)

  - id: python-pickle-loads
    languages: [python]
    severity: WARNING
    message: pickle.loads()/load() on untrusted data can execute arbitrary code.
    metadata:
      title: Unsafe pickle deserialization
      vibegate_category: injection
      vibegate_severity: medium
      confidence: LOW
      cwe: "CWE-502: Deserialization of Untrusted Data"
      remediation: Use a data-only format such as JSON for untrusted input.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  # ---------------------------------------------------------------- Misconfiguration
  - id: flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes an interactive debugger that allows code execution if reachable.
    metadata:
      title: Flask debug mode enabled
      vibegate_category: other
      vibegate_severity: medium
      confidence: HIGH
      cwe: "CWE-489: Active Debug Code"
      remediation: Read debug from configuration (off by default) and never enable it in production.
    pattern: $APP.run(..., debug=True, ...)

  # ---------------------------------------------------------------- XSS / SSTI
  - id: python-flask-ssti
    languages: [python]
    severity: ERROR
    message: render_template_string() with a dynamically built template can allow Server-Side Template Injection (SSTI) and remote code execution.
    metadata:
      title: Server-Side Template Injection (SSTI)
      vibegate_category: injection
      vibegate_severity: critical
      confidence: HIGH
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      remediation: Use render_template() with a static template file and pass user data as template variables.
    pattern-either:
      - pattern: render_template_string(f"...", ...)
      - pattern: render_template_string("..." + $X, ...)
      - pattern: render_template_string("...".format(...), ...)

  - id: js-xss-innerhtml
    languages: [javascript, typescript]
    severity: ERROR
    message: Assigning untrusted data to innerHTML or dangerouslySetInnerHTML can execute arbitrary JavaScript (XSS).
    metadata:
      title: Potential Cross-Site Scripting (XSS) via DOM sink
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-79: Cross-site Scripting"
      remediation: Use textContent / innerText, or sanitize HTML with DOMPurify before inserting into the DOM.
    pattern-either:
      - pattern: $EL.innerHTML = $VAL
      - pattern: document.write($VAL)

  # ---------------------------------------------------------------- SSRF / Path Traversal
  - id: python-ssrf-requests
    languages: [python]
    severity: ERROR
    message: Outbound HTTP request URL comes directly from request input, which may allow Server-Side Request Forgery (SSRF).
    metadata:
      title: Potential Server-Side Request Forgery (SSRF)
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-918: Server-Side Request Forgery"
      remediation: Validate the URL against an allowlist of trusted hosts/schemes before making the request.
    pattern-either:
      - pattern: requests.$M(request.$ATTR.get(...), ...)
      - pattern: requests.$M(request.$ATTR[...], ...)
      - pattern: urllib.request.urlopen(request.$ATTR.get(...), ...)

  - id: python-path-traversal
    languages: [python]
    severity: ERROR
    message: File path constructed from request input without sanitization can allow reading or overwriting arbitrary files (Path Traversal).
    metadata:
      title: Potential Path Traversal
      vibegate_category: injection
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-22: Path Traversal"
      remediation: Use werkzeug.utils.secure_filename() and verify the resolved realpath stays inside the intended base directory.
    pattern-either:
      - pattern: open(request.$ATTR.get(...), ...)
      - pattern: open(request.$ATTR[...], ...)
      - pattern: send_file(request.$ATTR.get(...), ...)
      - pattern: send_file(request.$ATTR[...], ...)

  # ---------------------------------------------------------------- Weak Crypto & TLS Bypass
  - id: python-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled (verify=False), exposing traffic to man-in-the-middle attacks.
    metadata:
      title: TLS certificate verification disabled
      vibegate_category: other
      vibegate_severity: high
      confidence: HIGH
      cwe: "CWE-295: Improper Certificate Validation"
      remediation: Remove verify=False and use proper CA certificates.
    pattern: requests.$M(..., verify=False, ...)

  - id: js-tls-reject-unauthorized-false
    languages: [javascript, typescript]
    severity: ERROR
    message: "TLS certificate validation is disabled (rejectUnauthorized: false), allowing man-in-the-middle attacks."
    metadata:
      title: TLS certificate validation disabled
      vibegate_category: other
      vibegate_severity: high
      confidence: HIGH
      cwe: "CWE-295: Improper Certificate Validation"
      remediation: "Remove rejectUnauthorized: false and configure trusted CA certificates."
    pattern: "{..., rejectUnauthorized: false, ...}"

  - id: python-weak-hash
    languages: [python]
    severity: WARNING
    message: MD5 and SHA-1 are cryptographically broken and unsuitable for passwords, signatures, or integrity checks.
    metadata:
      title: Weak hash algorithm (MD5/SHA-1)
      vibegate_category: other
      vibegate_severity: medium
      confidence: MEDIUM
      cwe: "CWE-328: Use of Weak Hash"
      remediation: Use SHA-256/SHA-512 for integrity checks, or Argon2/bcrypt/scrypt for password hashing.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: python-hardcoded-flask-secret
    languages: [python]
    severity: WARNING
    message: Hardcoded Flask secret_key allows attackers to forge session cookies.
    metadata:
      title: Hardcoded Flask session secret
      vibegate_category: secret
      vibegate_severity: high
      confidence: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      remediation: Load secret_key from an environment variable or secret manager (without a hardcoded production fallback).
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."

  # ---------------------------------------------------------------- AI-Boilerplate Access Control & DB Rules
  - id: python-flask-route-missing-auth
    languages: [python]
    severity: ERROR
    message: >-
      Flask route handles a user-specific resource ID without checking session/current_user ownership
      or using an auth decorator (potential IDOR / Broken Access Control).
    metadata:
      title: "Access Control: Flask route missing ownership/auth check"
      vibegate_category: access_control
      vibegate_severity: high
      confidence: MEDIUM
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      remediation: Verify that the authenticated user owns the requested resource ID before returning or modifying data.
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.route($ROUTE, ...)
              def $FN(..., $ID, ...):
                  ...
          - pattern: |
              @$APP.route($ROUTE, ...)
              def $FN(..., $ID: $T, ...):
                  ...
      - metavariable-regex:
          metavariable: $ROUTE
          regex: .*<.*(user_id|account_id|order_id|profile_id|id).*
      - metavariable-regex:
          metavariable: $ID
          regex: (?i).*(user_id|account_id|order_id|profile_id|id)$
      - pattern-not-inside: |
          @login_required
          def $FN(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          def $FN(...):
              ...
              session.get(...)
              ...
      - pattern-not: |
          @$APP.route(...)
          def $FN(...):
              ...
              current_user
              ...

  - id: python-fastapi-route-missing-auth
    languages: [python]
    severity: WARNING
    message: >-
      FastAPI route accepts a user/account/order ID path parameter without an auth dependency (Depends(...)).
    metadata:
      title: "Access Control: FastAPI route missing Depends() auth"
      vibegate_category: access_control
      vibegate_severity: medium
      confidence: MEDIUM
      cwe: "CWE-862: Missing Authorization"
      remediation: Add an authentication/authorization dependency via Depends(get_current_user) and verify ownership.
    patterns:
      - pattern: |
          @$APP.$METHOD($ROUTE, ...)
          def $FN(..., $ID: $T, ...):
              ...
      - metavariable-regex:
          metavariable: $ROUTE
          regex: .*\{.*(user_id|account_id|order_id|profile_id).*
      - metavariable-regex:
          metavariable: $ID
          regex: (?i).*(user_id|account_id|order_id|profile_id)$
      - pattern-not: |
          @$APP.$METHOD(...)
          def $FN(..., $USER = Depends(...), ...):
              ...

  - id: nosql-wildcard-public-rule
    languages: [generic]
    severity: ERROR
    message: Public wildcard read/write rule exposes the entire database to any unauthenticated user.
    metadata:
      title: Insecure public wildcard database rule
      vibegate_category: access_control
      vibegate_severity: critical
      confidence: HIGH
      cwe: "CWE-284: Improper Access Control"
      remediation: Restrict read/write rules to authenticated users who own the document (e.g., request.auth.uid == userId).
    pattern-either:
      - pattern: "allow read, write: if true;"
      - pattern: '".read": true'
      - pattern: '".write": true'

  # ---------------------------------------------------------------- Code Glitches & Common Bugs
  - id: python-bare-except
    languages: [python]
    severity: WARNING
    message: Bare `except:` catches SystemExit and KeyboardInterrupt and silently hides unexpected bugs.
    metadata:
      title: "Bug: Bare except clause"
      vibegate_category: bug
      vibegate_severity: medium
      confidence: HIGH
      cwe: "CWE-396: Declaration of Catch for Generic Exception"
      remediation: Catch specific exceptions (e.g., `except ValueError as exc:`) and log or handle the error explicitly.
    pattern: |
      try:
          ...
      except:
          ...

  - id: python-mutable-default-arg
    languages: [python]
    severity: WARNING
    message: Mutable default argument ([] or {}) is shared across all calls to this function, causing state leaks.
    metadata:
      title: "Bug: Mutable default argument"
      vibegate_category: bug
      vibegate_severity: medium
      confidence: HIGH
      cwe: "CWE-665: Improper Initialization"
      remediation: Use `None` as the default value and initialize a new list/dict inside the function body.
    pattern-either:
      - pattern: |
          def $FN(..., $ARG=[], ...):
              ...
      - pattern: |
          def $FN(..., $ARG={}, ...):
              ...

  - id: python-is-literal-comparison
    languages: [python]
    severity: WARNING
    message: Using `is` / `is not` to compare strings or numbers checks object identity, not value equality, and can fail unpredictably.
    metadata:
      title: "Bug: Identity (`is`) comparison with literal"
      vibegate_category: bug
      vibegate_severity: medium
      confidence: HIGH
      remediation: Use `==` or `!=` when comparing values to strings or numbers.
    pattern-either:
      - pattern: $X is "..."
      - pattern: $X is not "..."
      - pattern: $X is $NUM
      - pattern: $X is not $NUM
    metavariable-regex:
      metavariable: $NUM
      regex: ^-?\d+$

  - id: js-nan-equality
    languages: [javascript, typescript]
    severity: WARNING
    message: Comparing a value to `NaN` with `==` or `===` is always false in JavaScript.
    metadata:
      title: "Bug: Invalid NaN equality comparison"
      vibegate_category: bug
      vibegate_severity: medium
      confidence: HIGH
      remediation: Use `Number.isNaN(x)` instead of `x === NaN`.
    pattern-either:
      - pattern: $X == NaN
      - pattern: $X === NaN
      - pattern: $X != NaN
      - pattern: $X !== NaN

  - id: js-assignment-in-condition
    languages: [javascript, typescript]
    severity: WARNING
    message: Assignment (`=`) used inside an `if` condition instead of comparison (`===`).
    metadata:
      title: "Bug: Assignment inside if condition"
      vibegate_category: bug
      vibegate_severity: medium
      confidence: MEDIUM
      remediation: Replace `=` with `===` if you intended a comparison.
    pattern: if ($X = $Y) { ... }

